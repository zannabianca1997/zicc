[workspace]
resolver = "3"
members = [
  "assembler/ast", "assembler/lexer",
  "compiler",
  "compiler/ast",
  "compiler/lexer",
  "compiler/parser",
  "compiler/types",
  "utils/*",
  "vm"
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
zicc-compiler-ast = { path = "compiler/ast" }
zicc-compiler-lexer = { path = "compiler/lexer" }
zicc-frontmatter = { path = "utils/frontmatter" }
zicc-limits = { path = "utils/limits" }

clap = { version = "4.6.1", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["full"] }
lazy-regex = "3.6.0"
num = { version = "0.4.3", features = [
  "num-bigint",
] }
serde = { version = "1.0.228", features = ["derive"] }
snafu = "0.9.0"
string-interner = "0.19.0"
