[workspace]
resolver = "3"
members = [
  "compiler",
  "compiler/ast",
  "compiler/lexer",
  "compiler/parser",
  "compiler/types",
  "utils/*",
  "vm"
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
zicc-compiler-ast = { path = "compiler/ast" }
zicc-compiler-lexer = { path = "compiler/lexer" }
zicc-compiler-parser = { path = "compiler/parser" }
zicc-intcode = { path = "utils/intcode" }
zicc-limits = { path = "utils/limits" }

derive_more = { version = "2.1.1", features = ["full"] }
serde = "1.0.228"
string-interner = "0.19.0"

clap = { version = "4.6.1", features = ["derive"] }
